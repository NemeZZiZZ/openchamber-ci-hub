name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject internal planning documents
        run: |
          if [ -n "$(git ls-files 'docs/superpowers/**')" ]; then
            echo 'docs/superpowers must not be tracked in the public repository'
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - run: bun install --frozen-lockfile

      # typecheck + tests + bundle build + guest manifest check
      - run: bun run check

      # OpenChamber installs the committed bundles as they are and never builds.
      - name: Verify committed bundles match a clean rebuild
        run: git diff --exit-code -- panel/main.js panel/block.js panel/background.js service/main.js
