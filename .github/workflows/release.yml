# Release: on a v* tag, check, build and publish to npm.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # typecheck + tests + bundle build + guest manifest check
      - run: bun run check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # the tag is the source of truth for the published version
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # A release published by hand leaves this run green instead of failing
      # with E403 on a version that is already on the registry.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "openchamber-ci-hub@${version}" version >/dev/null 2>&1; then
            echo "openchamber-ci-hub@${version} is already on npm; nothing to publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
